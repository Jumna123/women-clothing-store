<div class="grid grid-cols-1 gap-4 md:grid-cols-2">
  <div class="md:col-span-2">
    <label class="mb-1.5 block text-sm font-semibold text-primary">Full Name</label>
    <input type="text" name="new_full_name" class="w-full rounded-lg border border-primary/20 bg-white py-2.5 px-3 text-sm text-primary focus:border-primary focus:ring-primary" placeholder="Jane Doe"/>
  </div>
  <div>
    <label class="mb-1.5 block text-sm font-semibold text-primary">Phone</label>
    <input type="tel" name="new_phone" class="w-full rounded-lg border border-primary/20 bg-white py-2.5 px-3 text-sm text-primary focus:border-primary focus:ring-primary" placeholder="+91 00000 00000"/>
  </div>
  <div>
    <label class="mb-1.5 block text-sm font-semibold text-primary">House / Flat No.</label>
    <input type="text" name="new_house_name" class="w-full rounded-lg border border-primary/20 bg-white py-2.5 px-3 text-sm text-primary focus:border-primary focus:ring-primary"/>
  </div>
  <div class="md:col-span-2">
    <label class="mb-1.5 block text-sm font-semibold text-primary">Street</label>
    <input type="text" name="new_street" class="w-full rounded-lg border border-primary/20 bg-white py-2.5 px-3 text-sm text-primary focus:border-primary focus:ring-primary"/>
  </div>
  <div>
    <label class="mb-1.5 block text-sm font-semibold text-primary">City</label>
    <input type="text" name="new_city" class="w-full rounded-lg border border-primary/20 bg-white py-2.5 px-3 text-sm text-primary focus:border-primary focus:ring-primary"/>
  </div>
  <div>
    <label class="mb-1.5 block text-sm font-semibold text-primary">State</label>
    <input type="text" name="new_state" class="w-full rounded-lg border border-primary/20 bg-white py-2.5 px-3 text-sm text-primary focus:border-primary focus:ring-primary"/>
  </div>
  <div>
    <label class="mb-1.5 block text-sm font-semibold text-primary">Pincode</label>
    <input type="text" name="new_pincode" class="w-full rounded-lg border border-primary/20 bg-white py-2.5 px-3 text-sm text-primary focus:border-primary focus:ring-primary" placeholder="000000"/>
  </div>
  <div class="md:col-span-2 flex items-center gap-2 mt-1">
    <input type="checkbox" name="save_new_address" id="save_new_address" class="text-primary focus:ring-primary"/>
    <label for="save_new_address" class="text-sm text-text-secondary">Save this address to my account</label>
  </div>
</div>
