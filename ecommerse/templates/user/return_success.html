{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Request Submitted — vólke shoppe</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Manrope', sans-serif; }
    .material-symbols-outlined { font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
  </style>
</head>
<body class="bg-[#f6faf8] min-h-screen flex flex-col items-center justify-center px-4">

  <div class="bg-white rounded-2xl border border-green-100 shadow-sm p-10 max-w-md w-full text-center">

    <div class="flex items-center justify-center size-20 rounded-full bg-green-100 mx-auto mb-6">
      <span class="material-symbols-outlined text-4xl text-green-600">check_circle</span>
    </div>

    <h1 class="text-xl font-black text-[#022c22] mb-2">Request Submitted!</h1>
    <p class="text-sm text-gray-500 font-medium mb-1">
      Your return/exchange request for Order
      <span class="font-bold text-[#064e3b]">#{{ order.id }}</span> has been received.
    </p>
    <p class="text-xs text-gray-400 font-medium mb-8">
      Our team will review it and get back to you within 2–3 business days.
    </p>

    <div class="flex flex-col gap-3">
      <a href="{% url 'home:order_detail' order.id %}"
        class="flex items-center justify-center gap-2 rounded-xl bg-[#064e3b] py-3.5 text-sm font-bold text-white hover:bg-[#022c22] transition-colors">
        <span class="material-symbols-outlined text-[18px]">receipt_long</span>
        View Order
      </a>
      <a href="{% url 'home:user_orders' %}"
        class="rounded-xl border border-green-200 py-3.5 text-sm font-bold text-[#064e3b] hover:bg-green-50 transition-colors">
        Back to My Orders
      </a>
    </div>

  </div>

</body>
</html>
